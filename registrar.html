{% extends "base.html" %}
{% block titulo %}Registrar{% endblock %}
{% block contenido %}
<h2>Registrar contacto</h2>
<form method="post" class="col-md-6">
  <div class="mb-3">
    <label for="nombre" class="form-label">Nombre</label>
    <input type="text" class="form-control" id="nombre" name="nombre" value="{{ nombre }}" maxlength="60">
  </div>
  <div class="mb-3">
    <label for="telefono" class="form-label">Teléfono</label>
    <input type="text" class="form-control" id="telefono" name="telefono" value="{{ telefono }}" maxlength="15">
  </div>
  <button type="submit" class="btn btn-primary">Guardar</button>
  <a href="{{ url_for('contactos') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
