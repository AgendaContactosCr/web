{% extends "base.html" %}
{% block titulo %}Contactos{% endblock %}
{% block contenido %}
<h2>Lista de contactos</h2>

<form method="get" class="mb-3 d-flex gap-2">
  <input type="text" name="q" value="{{ busqueda }}" class="form-control" placeholder="Buscar nombre o teléfono">
  <button class="btn btn-primary" type="submit">Buscar</button>
</form>

<table class="table table-bordered table-striped bg-white">
  <thead>
    <tr><th>#</th><th>Nombre</th><th>Teléfono</th><th>Acciones</th></tr>
  </thead>
  <tbody>
    {% for c in contactos %}
    <tr>
      <td>{{ loop.index }}</td>
      <td>{{ c.nombre }}</td>
      <td>{{ c.telefono }}</td>
      <td>
        <a href="{{ url_for('editar', id_contacto=c.id) }}" class="btn btn-sm btn-warning">Editar</a>
        <form method="post" action="{{ url_for('eliminar', id_contacto=c.id) }}" class="d-inline"
              onsubmit="return confirm('¿Eliminar a {{ c.nombre }}?');">
          <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="4" class="text-center">No hay contactos.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
