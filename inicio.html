{% extends "base.html" %}
{% block titulo %}Inicio{% endblock %}
{% block contenido %}
<h1>Agenda Telefónica</h1>
<p>Aplicación para guardar nombres y números de teléfono. Puede agregar, ver, modificar y eliminar contactos.</p>

{% endblock %}
